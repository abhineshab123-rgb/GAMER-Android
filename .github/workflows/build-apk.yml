
name: Build GAMER APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/gamer/tournament

          cp MainActivity.kt app/src/main/java/com/gamer/tournament/
          cp AndroidManifest.xml app/src/main/
          cp index.html app/src/main/assets/

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.gamer.tournament"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.gamer.tournament"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
